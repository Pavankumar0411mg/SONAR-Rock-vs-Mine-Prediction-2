<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SONAR Rock vs Mine Predictor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117;--surface:#161b22;--border:#30363d;
    --blue:#2f81f7;--green:#3fb950;--red:#f85149;
    --text:#e6edf3;--muted:#8b949e;--radius:10px;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
  h1{font-size:1.6rem;margin-bottom:.3rem}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:2rem;text-align:center}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:860px;margin-bottom:1.5rem}
  .card-title{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.05em}
  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:7px;font-size:.83rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:.15s}
  .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn-primary:hover{background:#1a6fe0}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
  .btn-outline:hover{background:#1c2330}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:.4rem;margin-bottom:1rem}
  .fi{display:flex;flex-direction:column;gap:.15rem}
  .fi label{font-size:.6rem;color:var(--muted);text-align:center}
  .fi input{width:100%;padding:.3rem .25rem;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:.72rem;text-align:center;outline:none;transition:.15s}
  .fi input:focus{border-color:var(--blue)}
  .fi input.err{border-color:var(--red)}
  .predict-btn{width:100%;padding:.65rem;font-size:.95rem;border-radius:8px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-weight:600;transition:.15s}
  .predict-btn:hover{background:#1a6fe0}
  .result{display:none;margin-top:1.2rem;padding:1.5rem;border-radius:var(--radius);text-align:center;border:2px solid}
  .result.rock{background:rgba(63,185,80,.08);border-color:var(--green)}
  .result.mine{background:rgba(248,81,73,.08);border-color:var(--red)}
  .result-icon{font-size:3rem;margin-bottom:.5rem}
  .result-label{font-size:2rem;font-weight:800;letter-spacing:.05em}
  .result-label.rock{color:var(--green)}
  .result-label.mine{color:var(--red)}
  .result-conf{color:var(--muted);font-size:.9rem;margin-top:.3rem}
  .bars{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem;max-width:300px;margin-inline:auto}
  .bar-row{display:flex;align-items:center;gap:.6rem;font-size:.8rem}
  .bar-row span:first-child{width:36px;text-align:right;color:var(--muted)}
  .bar-row span:last-child{width:44px;color:var(--muted)}
  .track{flex:1;height:7px;background:#1c2330;border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:4px;transition:width .5s ease}
  .fill.g{background:var(--green)}
  .fill.r{background:var(--red)}
  .err-msg{display:none;margin-top:.8rem;padding:.5rem .8rem;background:rgba(248,81,73,.1);border:1px solid var(--red);border-radius:6px;font-size:.82rem;color:var(--red)}
  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
  .info-item{text-align:center;padding:.8rem;background:#0d1117;border-radius:8px}
  .info-val{font-size:1.4rem;font-weight:700;color:var(--blue)}
  .info-lbl{font-size:.75rem;color:var(--muted);margin-top:.2rem}
  @media(max-width:600px){.grid{grid-template-columns:repeat(6,1fr)}.info-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
